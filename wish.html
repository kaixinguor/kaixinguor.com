      <button class="lang-btn" id="lang-toggle" onclick="toggleLang()">EN</button>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深浅色">◐</button>
    </nav>
  </div>
</header>

<main id="main">
  <header class="page-head">
    <div class="wrap">
      <div class="kicker">
        <span class="zh">WISH</span>
        <span class="sep"></span>
        <span>One concrete annoyance</span>
      </div>
      <h1 data-i18n="wish.title">你想让它干什么？</h1>
      <p class="deck" data-i18n="wish.deck">一个工具，往往是从一件具体的小麻烦开始的。说说你那一件。</p>
    </div>
  </header>

  <div class="wrap" style="padding-top:30px">
    <form class="wish-form" id="wish">

      <label>
        <span data-i18n="wish.q1">你想让它帮你干什么？</span>
        <textarea name="what" rows="3" required data-i18n-ph="wish.q1.ph"
          placeholder="例：把网课里老师说的重点自动挑出来，做成一张知识点清单。"></textarea>
      </label>

      <label>
        <span data-i18n="wish.q2">你现在是怎么应付这件事的？</span>
        <textarea name="now" rows="2" required data-i18n-ph="wish.q2.ph"
          placeholder="例：一边听一边手打，一节课记四五页，还经常漏。"></textarea>
        <em data-i18n="wish.q2.note">没有替代方案的需求，多半不是真需求。</em>
      </label>

      <div class="row2">
        <label>
          <span data-i18n="wish.q3">多久会碰到一次？</span>
          <select name="freq">
            <option data-i18n="wish.f1">每天</option>
            <option data-i18n="wish.f2">每周</option>
            <option data-i18n="wish.f3">每月</option>
            <option data-i18n="wish.f4">一年几次</option>
          </select>
        </label>

        <label>
          <span data-i18n="wish.q5">主要在哪台设备上用？</span>
          <select name="platform">
            <option>Mac</option>
            <option data-i18n="wish.d2">Mac + iPhone</option>
            <option data-i18n="wish.d3">iPad</option>
            <option data-i18n="wish.d4">主要用 Windows</option>
          </select>
        </label>
      </div>

      <label>
        <span data-i18n="wish.q4">如果已经有人做好了，你愿意付多少？</span>
        <select name="price">
          <option data-i18n="wish.p0">不想付钱，免费才用</option>
          <option data-i18n="wish.p1">¥50 以内</option>
          <option data-i18n="wish.p2">¥50 – ¥200</option>
          <option data-i18n="wish.p3">¥200 – ¥1000</option>
          <option data-i18n="wish.p4">¥1000 以上，愿意单独定制</option>
        </select>
      </label>

      <label>
        <span data-i18n="wish.q6">怎么联系你（可选）</span>
        <input name="contact" data-i18n-ph="wish.q6.ph" placeholder="邮箱或微信">
      </label>

      <div class="wish-actions">
        <button class="btn btn-primary" type="submit" data-i18n="wish.send">发送</button>
        <span class="faint" data-i18n="wish.note">会打开你的邮件客户端，内容已经填好。</span>
      </div>

    </form>
  </div>
</main>

<script src="lang.js"></script>
<script src="site.js?v=5"></script>
<script>
document.getElementById('wish').addEventListener('submit', function (e) {
  e.preventDefault();
  const f = e.target;
  const v = (n) => (f.elements[n].value || '').trim();
  const body = [
    '1. 想让它干什么：', v('what'), '',
    '2. 现在怎么应付：', v('now'), '',
    '3. 多久碰到一次：', f.elements.freq.selectedOptions[0].text, '',
    '4. 愿意付多少：', f.elements.price.selectedOptions[0].text, '',
    '5. 主要设备：', f.elements.platform.selectedOptions[0].text, '',
    '6. 联系方式：', v('contact') || '(没填)'
  ].join('\n');
  const subject = '许愿：' + (v('what').slice(0, 40) || '一个新工具');
  location.href = 'mailto:linr.w@163.com?subject=' + encodeURIComponent(subject)
                + '&body=' + encodeURIComponent(body);
});
</script>
</body>
</html>
