<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · kaixinguor</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<script>
/* 在渲染前就定好语言，避免先闪中文再变英文 */
(function () {
  try {
    var l = localStorage.getItem("kaixinguor.lang") || "zh";
    var en = l === "en";
    document.documentElement.lang = en ? "en" : "zh-CN";
    if (en) {
      document.documentElement.setAttribute("data-pending", "1");
      setTimeout(function () {
        document.documentElement.removeAttribute("data-pending");
      }, 800);
    }
  } catch (e) {}
})();
</script>
<style>html[data-pending] body{visibility:hidden!important}</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="brand" href="/">kaixinguor</a>
    <nav class="top">
      <a href="/tools.html" data-i18n="nav.tools">工具</a>
      <a href="/wish.html" data-i18n="nav.wish">许愿</a>
      <button class="lang-btn" id="lang-toggle" onclick="toggleLang()">EN</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <p class="eyebrow">404</p>
    <h1 data-i18n="e404.title">这页不存在。</h1>
    <p class="lead" data-i18n="e404.lead">可能是链接变了，也可能是我写错了。</p>
    <p><a class="btn btn-ghost" href="/" data-i18n="e404.home">回首页</a></p>
  </div>
</main>

<footer class="site">
  <div class="wrap">
    <span>© 2026 kaixinguor</span>
    <a href="/privacy.html" data-i18n="footer.privacy">隐私</a>
  </div>
</footer>

<script src="/lang.js"></script>
</body>
</html>
