<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kaixinguor</title>
<meta name="description" content="一个人做的小工具。从许愿到交付。">
<meta property="og:title" content="kaixinguor">
<meta property="og:description" content="一个人做的小工具。从许愿到交付。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=4">
<script>
/* 在渲染前就定好语言，避免先闪中文再变英文 */
(function () {
  try {
    var l = localStorage.getItem("kaixinguor.lang") || "zh";
    var en = l === "en";
    document.documentElement.lang = en ? "en" : "zh-CN";
    if (en) {
      document.documentElement.setAttribute("data-pending", "1");
      setTimeout(function () {
        document.documentElement.removeAttribute("data-pending");
      }, 800);
    }
  } catch (e) {}
})();
</script>
<style>html[data-pending] body{visibility:hidden!important}</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="brand" href="index.html">kaixinguor</a>
    <nav class="top">
      <a href="tools.html" data-i18n="nav.tools">工具</a>
      <a href="wish.html" data-i18n="nav.wish">许愿</a>
      <button class="lang-btn" id="lang-toggle" onclick="toggleLang()">EN</button>
    </nav>
  </div>
</header>

<main class="wrap">

  <div class="poster">
    <h1 data-i18n="home.h1">做你想用的<br>那个工具。</h1>

    <div class="panels">
      <a class="panel" href="tools.html">
        <span class="panel-label" data-i18n="home.panel.tools">已经做好</span>
        <span class="panel-arrow">→</span>
      </a>
      <a class="panel" href="wish.html">
        <span class="panel-label" data-i18n="home.panel.wish">说说你想要什么</span>
        <span class="panel-arrow">→</span>
      </a>
    </div>
  </div>

</main>

<footer class="site">
  <div class="wrap">
    <span>© 2026 kaixinguor</span>
    <a href="privacy.html" data-i18n="footer.privacy">隐私</a>
  </div>
</footer>

<script src="lang.js"></script>
</body>
</html>
