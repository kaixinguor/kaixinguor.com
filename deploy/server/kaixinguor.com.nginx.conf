# kaixinguor.com —— 与 mathster.cn（Aiseum）共存于同一台阿里云 ECS
#
# 安装位置：/etc/nginx/sites-available/kaixinguor.com
# 启用：    sudo ln -s /etc/nginx/sites-available/kaixinguor.com /etc/nginx/sites-enabled/
#
# 两个站点完全独立：各自一个 server 块，nginx 按 Host / SNI 分流，
# 改这个文件不会影响 /etc/nginx/sites-available/mathster.cn。
#
# 注意：这里只写 80 端口。443 和证书路径交给 certbot 生成，
# 不要手写 ssl_certificate 指向自备 pem。
#
# 2026-11-26 已上线：服务器上的这份配置已被 certbot 改成「443 + 80 跳转」，
# 证书在 /etc/letsencrypt/live/kaixinguor.com/。日常更新只需 rsync 文件，
# 不要再把本模板 scp 上去覆盖。

server {
    listen 80;
    server_name kaixinguor.com www.kaixinguor.com;

    root  /home/project/kaixinguor.com;
    index index.html;
    charset utf-8;

    # 从 Cloudflare 的 _headers 迁过来的全局安全头
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # 旧链接 /daily/* → /daily-ai/web/*.html（原 _redirects 的 /daily/* 规则）
    location ^~ /daily/ {
        rewrite ^/daily/([0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9](-en)?)(\.html)?$ /daily-ai/web/$1.html permanent;
        rewrite ^/daily/(.*)$ /daily-ai/$1 permanent;
    }

    # /daily-ai/2026-10-26(.html) → /daily-ai/web/2026-10-26.html（收进 web/ 之前的旧链接）
    location ~ ^/daily-(ai|economy|education|psychology)/([0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9](-en)?)(\.html)?$ {
        return 301 /daily-$1/web/$2.html;
    }

    # 静态资源 7 天（原 /assets/*）
    location ^~ /assets/ {
        expires 7d;
    }

    # CSS / JS 1 小时（原 /*.css、/*.js）
    location ~* \.(css|js)$ {
        expires 1h;
    }

    # RSS：不缓存，并给出正确的 Content-Type（.xml 已在 mime.types 里，
    # 必须用 types{} 覆盖，default_type 对它不生效）
    location ~* ^/feed.*\.xml$ {
        types { application/rss+xml xml; }
        expires -1;
    }

    # HTML 不缓存，改完立刻生效
    location ~* \.html$ {
        expires -1;
    }

    # 目录（/hark/、/snipread/）要能找到里面的 index.html
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Cloudflare 专用文件，不对外暴露
    location = /_headers   { return 404; }
    location = /_redirects { return 404; }
    location = /.nojekyll  { return 404; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json
               application/rss+xml image/svg+xml text/plain text/xml;
}
