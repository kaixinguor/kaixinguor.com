# kaixinguor.com —— 与 mathster.cn（Aiseum）共存于同一台阿里云 ECS
#
# 安装位置：/etc/nginx/sites-available/kaixinguor.com
# 启用：    sudo ln -s /etc/nginx/sites-available/kaixinguor.com /etc/nginx/sites-enabled/
#
# 两个站点完全独立：各自一个 server 块，nginx 按 Host / SNI 分流，
# 改这个文件不会影响 /etc/nginx/sites-available/mathster.cn。
#
# 注意：这里只写 80 端口。443 和证书路径交给 certbot 生成，
# 不要手写 ssl_certificate 指向自备 pem —— aiseum 那次覆盖配置
# 退回旧证书路径导致 HTTPS 失效，就是栽在这上面。

server {
    listen 80;
    server_name kaixinguor.com www.kaixinguor.com;

    root  /home/project/kaixinguor.com;
    index index.html;
    charset utf-8;

    # 从 Cloudflare 的 _headers 迁过来的全局安全头
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # 旧链接 /daily/* → /daily-ai/*（原 _redirects）
    location ^~ /daily/ {
        rewrite ^/daily/(.*)$ /daily-ai/$1 permanent;
    }

    # 静态资源 7 天（原 /assets/*）
    location ^~ /assets/ {
        expires 7d;
    }

    # CSS / JS 1 小时（原 /*.css、/*.js）
    location ~* \.(css|js)$ {
        expires 1h;
    }

    # RSS：不缓存，并给出正确的 Content-Type
    location ~* ^/feed(-en|-economy|-economy-en)?\.xml$ {
        default_type application/rss+xml;
        expires -1;
    }

    # HTML 不缓存，改完立刻生效
    location ~* \.html$ {
        expires -1;
    }

    # 目录（/hark/、/snipread/）要能找到里面的 index.html
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Cloudflare 专用文件，不对外暴露
    location = /_headers   { return 404; }
    location = /_redirects { return 404; }
    location = /.nojekyll  { return 404; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json
               application/rss+xml image/svg+xml text/plain text/xml;
}
